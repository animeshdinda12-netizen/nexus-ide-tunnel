<script type="text/babel" data-presets="react">
/* ═══════════════════════════════════════════════════════════════════════════
   NEXUS IDE — CORE RUNTIME
   Storage, templates, document assembly, UI atoms, error traps, SW bridge.
   ═══════════════════════════════════════════════════════════════════════════ */
const {
  useState, useEffect, useRef, useMemo, useCallback, useContext,
  createContext, useReducer
} = React;

/* ── 1 · ICON BRIDGE ───────────────────────────────────────────────────────
   Primary: lucide-react UMD (React components).
   Fallback: vanilla `lucide.icons` raw node data rendered to inline SVG.
   Terminal fallback: a neutral glyph so the chrome never collapses.          */
const KEBAB = (s) => String(s)
  .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
  .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
  .toLowerCase();

const SVG_ATTRS = {
  'stroke-width': 'strokeWidth', 'stroke-linecap': 'strokeLinecap',
  'stroke-linejoin': 'strokeLinejoin', 'fill-rule': 'fillRule',
  'clip-rule': 'clipRule', 'stroke-dasharray': 'strokeDasharray'
};

function rawNodeToSvg(node, size, className, strokeWidth) {
  const list = Array.isArray(node) ? node : [];
  const kids = [];
  for (let i = 0; i < list.length; i++) {
    const item = list[i];
    if (!Array.isArray(item) || !item[0]) continue;
    const props = { key: 'k' + i };
    const attrs = item[1] || {};
    for (const k in attrs) props[SVG_ATTRS[k] || k] = attrs[k];
    kids.push(React.createElement(item[0], props));
  }
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill="none" stroke="currentColor" strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
      {kids}
    </svg>
  );
}

function Icon({ name, size = 16, className = '', strokeWidth = 2 }) {
  const LR = typeof window !== 'undefined' ? window.LucideReact : null;
  if (LR && typeof LR[name] === 'function') {
    const Cmp = LR[name];
    return <Cmp size={size} className={className} strokeWidth={strokeWidth} />;
  }
  const vanilla = (typeof window !== 'undefined' && window.lucide && window.lucide.icons) ? window.lucide.icons : null;
  if (vanilla) {
    const node = vanilla[KEBAB(name)] || vanilla[name];
    if (node) return rawNodeToSvg(node, size, className, strokeWidth);
  }
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill="none" stroke="currentColor" strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
    </svg>
  );
}

/* ── 2 · CONSTANTS ─────────────────────────────────────────────────────── */
const APP = {
  name: 'NEXUS IDE',
  tagline: 'Backendless Studio · Browser Tunnel',
  version: '1.0.0',
  ttl: 900000,          // 15 minutes — tunnel lifetime
  urlBudget: 32000      // soft ceiling before we warn about URL length
};

const K_PROJECTS = 'nexus.ide.projects.v1';
const K_PREFS = 'nexus.ide.prefs.v1';
const K_TUNNELS = 'nexus.ide.tunnels.v1';
const K_REVOKED = 'nexus.ide.revoked.v1';

/* ── 3 · UTILITIES ─────────────────────────────────────────────────────── */
function uid(prefix) {
  const rnd = (typeof crypto !== 'undefined' && crypto.getRandomValues)
    ? Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b => b.toString(16).padStart(2, '0')).join('')
    : Math.random().toString(36).slice(2, 14);
  return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + rnd;
}

function fmtDate(ts) {
  if (!ts) return '—';
  try {
    return new Date(ts).toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit'
    });
  } catch (e) { return '—'; }
}

function fmtRelative(ts) {
  if (!ts) return 'never';
  const d = Date.now() - ts;
  if (d < 60000) return 'just now';
  if (d < 3600000) return Math.floor(d / 60000) + 'm ago';
  if (d < 86400000) return Math.floor(d / 3600000) + 'h ago';
  if (d < 2592000000) return Math.floor(d / 86400000) + 'd ago';
  return fmtDate(ts);
}

function fmtClock(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function bytesFmt(n) {
  const b = Number(n) || 0;
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(2) + ' MB';
}

function safeFileName(name, fallback) {
  const base = String(name || '').trim().replace(/[^a-zA-Z0-9._-]+/g, '-').replace(/^-+|-+$/g, '');
  return (base || fallback || 'nexus-project').slice(0, 64);
}

function lineCount(text) {
  if (!text) return 0;
  return text.split('\n').length;
}

/** Debounce a value — used to keep the live preview from thrashing on keystrokes. */
function useDebounced(value, delay) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const t = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(t);
  }, [value, delay]);
  return debounced;
}

/* ── 4 · STORAGE LAYER (quota-safe) ────────────────────────────────────── */
const Storage = {
  available: true,
  reason: '',

  probe() {
    try {
      const k = '__nx_probe__';
      window.localStorage.setItem(k, '1');
      window.localStorage.removeItem(k);
      this.available = true;
      this.reason = '';
    } catch (e) {
      this.available = false;
      this.reason = (e && e.name === 'SecurityError')
        ? 'LocalStorage is blocked in this context (private mode or third-party cookie policy). Projects will live in memory only.'
        : 'LocalStorage is unavailable: ' + String(e && e.message || e);
    }
    return this.available;
  },

  read(key, fallback) {
    if (!this.available) return fallback;
    try {
      const raw = window.localStorage.getItem(key);
      if (raw === null || raw === undefined) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      console.warn('[NEXUS] storage read failed for', key, e);
      return fallback;
    }
  },

  write(key, value) {
    if (!this.available) return { ok: false, error: 'unavailable', message: this.reason };
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
      return { ok: true };
    } catch (e) {
      const name = e && e.name;
      const quota = name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED' || (e && e.code === 22);
      return {
        ok: false,
        error: quota ? 'quota' : 'unknown',
        message: quota
          ? 'LocalStorage quota exceeded. Delete an unused project or trim a large file, then try again.'
          : String(e && e.message || e)
      };
    }
  },

  remove(key) {
    try { window.localStorage.removeItem(key); return true; } catch (e) { return false; }
  }
};

/* ── 6 · PROJECT MODEL & DOCUMENT ASSEMBLY ─────────────────────────────── */

/**
 * Merge the three panes into one portable document.
 * CSS is injected before the closing </head>, JS before </body>.
 * Falls back to prepending / appending when the shell has no closing tags.
 */
function assembleDocument(html, css, js) {
  let doc = typeof html === 'string' ? html : '';
  const cssBlock = (typeof css === 'string' && css.trim())
    ? '\n<style data-nexus="css">\n' + css + '\n<\/style>\n' : '';
  const jsBlock = (typeof js === 'string' && js.trim())
    ? '\n<script data-nexus="js">\n' + js + '\n<\/script>\n' : '';

  if (cssBlock) {
    if (/<\/head>/i.test(doc)) doc = doc.replace(/<\/head>/i, cssBlock + '</head>');
    else doc = cssBlock + doc;
  }
  if (jsBlock) {
    if (/<\/body>/i.test(doc)) doc = doc.replace(/<\/body>/i, jsBlock + '</body>');
    else doc = doc + jsBlock;
  }
  return doc;
}

/** Produce the exact string that ships through the tunnel / download / preview. */
function buildDocument(project) {
  if (!project || !project.files) return '';
  const f = project.files;
  if (project.type === 'single') return f.html || '';
  return assembleDocument(f.html || '', f.css || '', f.js || '');
}

/** Assign an imported file to the correct pane (and fold into HTML for unified projects). */
function ingestFile(project, fileName, text) {
  const ext = String(fileName || '').split('.').pop().toLowerCase();
  let html = project.files.html || '';
  let css = project.files.css || '';
  let js = project.files.js || '';

  if (ext === 'html' || ext === 'htm') html = text;
  else if (ext === 'css') css = text;
  else if (ext === 'js' || ext === 'mjs' || ext === 'cjs') js = text;
  else html = text;

  if (project.type === 'single') {
    return { ...project, files: { html: assembleDocument(html, css, js), css: '', js: '' } };
  }
  return { ...project, files: { html, css, js } };
}

function makeProject(name, type, seed) {
  const s = seed || {};
  const now = Date.now();
  const isSingle = type === 'single';
  return {
    id: uid('prj'),
    name: (name && name.trim()) || 'Untitled Project',
    type: isSingle ? 'single' : 'split',
    createdAt: now,
    updatedAt: now,
    files: isSingle
      ? { html: typeof s.html === 'string' ? s.html : STARTER_SINGLE, css: '', js: '' }
      : {
          html: typeof s.html === 'string' ? s.html : STARTER_SPLIT_HTML,
          css: typeof s.css === 'string' ? s.css : STARTER_SPLIT_CSS,
          js: typeof s.js === 'string' ? s.js : STARTER_SPLIT_JS
        }
  };
}

/* ── 7 · DOWNLOAD HELPERS ──────────────────────────────────────────────── */
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function downloadProject(project) {
  const doc = buildDocument(project);
  const base = safeFileName(project.name, 'nexus-project');

  if (project.type === 'single') {
    triggerDownload(new Blob([doc], { type: 'text/html;charset=utf-8' }), base + '.html');
    return { kind: 'html', filename: base + '.html' };
  }

  if (typeof window.JSZip === 'undefined') {
    triggerDownload(new Blob([doc], { type: 'text/html;charset=utf-8' }), base + '-bundled.html');
    return { kind: 'html-fallback', filename: base + '-bundled.html' };
  }

  const zip = new window.JSZip();
  const root = zip.folder(base);
  root.file('index.html', project.files.html || '');
  root.file('style.css', project.files.css || '');
  root.file('script.js', project.files.js || '');
  root.folder('dist').file('index.html', doc);
  root.file('README.txt',
    APP.name + ' ' + APP.version + '\n' +
    'Project: ' + project.name + '\n' +
    'Type: Multi-file Split\n' +
    'Exported: ' + new Date().toISOString() + '\n\n' +
    'index.html  → markup pane\n' +
    'style.css   → stylesheet pane\n' +
    'script.js   → behaviour pane\n' +
    'dist/index.html → the three panes compiled into one portable document\n');
  zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 9 } })
    .then((blob) => triggerDownload(blob, base + '.zip'))
    .catch((err) => {
      console.warn('[NEXUS] zip failed, falling back to bundled html', err);
      triggerDownload(new Blob([doc], { type: 'text/html;charset=utf-8' }), base + '-bundled.html');
    });
  return { kind: 'zip', filename: base + '.zip' };
}

/* ── 8 · SERVICE WORKER BRIDGE ─────────────────────────────────────────── */
const SWBridge = {
  supported: typeof navigator !== 'undefined' && 'serviceWorker' in navigator,
  secure: typeof window !== 'undefined' ? window.isSecureContext : false,
  registration: null,
  error: '',
  state: 'unsupported',

  swUrl() { return new URL('sw.js', window.location.href).href; },
  scopeUrl() { return new URL('./', window.location.href).href; },

  async register() {
    if (!this.supported) {
      this.state = this.secure ? 'unsupported' : 'insecure';
      this.error = this.secure
        ? 'This browser does not expose the Service Worker API.'
        : 'Service Workers require a secure context (https:// or localhost). The tunnel link still works — preview.html decodes the payload client-side.';
      return null;
    }
    try {
      const reg = await navigator.serviceWorker.register(this.swUrl(), {
        scope: this.scopeUrl(),
        updateViaCache: 'none'
      });
      this.registration = reg;
      this.state = 'registered';
      await Promise.race([
        navigator.serviceWorker.ready,
        new Promise((r) => setTimeout(r, 4000))
      ]);
      this.state = navigator.serviceWorker.controller ? 'controlling' : 'active';
      this.error = '';
      return reg;
    } catch (e) {
      this.state = 'failed';
      this.error = String((e && e.message) || e);
      console.warn('[NEXUS] service worker registration failed', e);
      return null;
    }
  },

  worker() {
    if (typeof navigator === 'undefined' || !this.supported) return null;
    return navigator.serviceWorker.controller ||
      (this.registration && (this.registration.active || this.registration.waiting || this.registration.installing)) ||
      null;
  },

  post(message) {
    const w = this.worker();
    if (!w) return false;
    try { w.postMessage(message); return true; } catch (e) { return false; }
  }
};

/* ── 9 · TUNNEL PAYLOAD ENGINE ─────────────────────────────────────────── */

/**
 * Pack the project into a compressed, self-expiring URL payload.
 * The payload is a JSON envelope compressed with lz-string's
 * compressToEncodedURIComponent (URL-safe, base64-ish alphabet).
 */
function buildTunnel(project) {
  const doc = buildDocument(project);
  const id = uid('tun');
  const exp = Date.now() + APP.ttl;
  const envelope = { v: 1, id: id, n: project.name, t: project.type, e: exp, h: doc };

  if (typeof window.LZString === 'undefined') {
    return { ok: false, error: 'LZString is not loaded. Check your network connection to the CDN and reload.' };
  }

  let payload;
  try {
    payload = window.LZString.compressToEncodedURIComponent(JSON.stringify(envelope));
  } catch (e) {
    return { ok: false, error: 'Compression failed: ' + String((e && e.message) || e) };
  }
  if (!payload) return { ok: false, error: 'Compression produced an empty payload.' };

  const base = new URL('preview.html', window.location.href).href;
  const url = base + '?t=' + payload + '&e=' + exp + '&id=' + encodeURIComponent(id);

  return {
    ok: true,
    id: id,
    exp: exp,
    url: url,
    docBytes: doc.length,
    payloadChars: payload.length,
    urlLength: url.length,
    ratio: doc.length ? Math.max(1, Math.round((1 - payload.length / doc.length) * 100)) : 0,
    oversized: url.length > APP.urlBudget
  };
}

/* ── 10 · CLIPBOARD ────────────────────────────────────────────────────── */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through to the legacy path */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

/* ── 12 · ERROR BOUNDARY ───────────────────────────────────────────────── */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, info: null };
  }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) {
    console.error('[NEXUS] render failure', error, info);
    this.setState({ info });
  }
  render() {
    if (!this.state.error) return this.props.children;
    const err = this.state.error;
    return (
      <div className="nx-scroll h-full overflow-auto bg-slate-950 p-6">
        <div className="mx-auto max-w-2xl rounded-2xl border border-rose-500/30 bg-slate-900/80 p-7 backdrop-blur-md">
          <div className="flex items-center gap-3">
            <div className="grid h-11 w-11 place-items-center rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-300">
              <Icon name="ShieldAlert" size={20} />
            </div>
            <div>
              <h1 className="text-lg font-bold text-white">Workspace crashed</h1>
              <p className="text-xs text-slate-400">The interface hit an unrecoverable render error. Your projects are still safe in LocalStorage.</p>
            </div>
          </div>
          <pre className="nx-scroll mt-5 max-h-56 overflow-auto rounded-xl border border-slate-800/70 bg-slate-950/80 p-4 text-[11.5px] leading-relaxed text-rose-200">
            {String((err && err.stack) || (err && err.message) || err)}
            {this.state.info && this.state.info.componentStack ? '\n\n' + this.state.info.componentStack : ''}
          </pre>
          <div className="mt-5 flex flex-wrap gap-2">
            <Button variant="primary" size="sm" icon="RotateCcw" onClick={() => this.setState({ error: null, info: null })}>
              Recover interface
            </Button>
            <Button variant="ghost" size="sm" icon="RefreshCw" onClick={() => window.location.reload()}>
              Hard reload
            </Button>
            <Button variant="danger" size="sm" icon="Trash2" onClick={() => {
              try { window.localStorage.clear(); } catch (e) { /* ignore */ }
              window.location.reload();
            }}>
              Purge storage &amp; reload
            </Button>
          </div>
          <p className="mt-4 text-[11px] text-slate-500">
            Purge storage permanently deletes every project held in this browser. Download anything you need first.
          </p>
        </div>
      </div>
    );
  }
}

/* ── NEW PROJECT WIZARD (2 sequential steps) ───────────────────────────── */
function NewProjectModal({ open, onClose, onCreate }) {
  const [step, setStep] = useState(1);
  const [type, setType] = useState('single');
  const [name, setName] = useState('');
  const [imported, setImported] = useState(null);   // { name, text, ext }
  const [importError, setImportError] = useState('');
  const [nameError, setNameError] = useState('');
  const [dragging, setDragging] = useState(false);
  const fileRef = useRef(null);

  useEffect(() => {
    if (open) {
      setStep(1); setType('single'); setName(''); setImported(null);
      setImportError(''); setNameError(''); setDragging(false);
    }
  }, [open]);

  const readFile = useCallback((file) => {
    if (!file) return;
    const ext = String(file.name).split('.').pop().toLowerCase();
    const allowed = ['html', 'htm', 'css', 'js', 'mjs', 'cjs', 'txt', 'md', 'svg', 'json'];
    if (allowed.indexOf(ext) === -1) {
      setImportError('Unsupported file type ".' + ext + '". Import HTML, CSS, JS, JSON, SVG or plain text.');
      setImported(null);
      return;
    }
    if (file.size > 2 * 1024 * 1024) {
      setImportError('File is larger than 2 MB (' + bytesFmt(file.size) + '). Import a smaller source file.');
      setImported(null);
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => setImportError('The browser could not read that file.');
    reader.onload = () => {
      setImportError('');
      setImported({ name: file.name, text: String(reader.result || ''), ext: ext });
      if (!name.trim()) setName(file.name.replace(/\.[^.]+$/, ''));
    };
    reader.readAsText(file);
  }, [name]);

  const onDrop = (e) => {
    e.preventDefault();
    setDragging(false);
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    readFile(file);
  };

  const submit = () => {
    const trimmed = name.trim();
    if (!trimmed) { setNameError('Give the project a name before creating it.'); setStep(2); return; }
    if (trimmed.length > 64) { setNameError('Keep the project name under 64 characters.'); return; }
    const seed = {};
    if (imported) {
      const probe = { type, files: { html: '', css: '', js: '' } };
      const merged = ingestFile(probe, imported.name, imported.text);
      seed.html = merged.files.html;
      seed.css = merged.files.css;
      seed.js = merged.files.js;
    }
    onCreate(trimmed, type, seed, imported ? imported.name : null);
  };

  const structureCard = (value, icon, title, body, tone) => {
    const active = type === value;
    const tones = {
      cyan: active ? 'border-cyan-500/70 bg-cyan-500/10 shadow-lg shadow-cyan-500/20' : 'border-slate-800/70 bg-slate-950/50 hover:border-cyan-500/40',
      violet: active ? 'border-violet-500/70 bg-violet-500/10 shadow-lg shadow-violet-500/20' : 'border-slate-800/70 bg-slate-950/50 hover:border-violet-500/40'
    };
    return (
      <button type="button" onClick={() => setType(value)}
        className={cx('group relative flex flex-col rounded-2xl border p-5 text-left transition-all duration-300 hover:-translate-y-0.5', tones[tone])}>
        <div className="flex items-center justify-between">
          <div className={cx('grid h-11 w-11 place-items-center rounded-xl border',
            tone === 'cyan' ? 'border-cyan-500/30 bg-cyan-500/10 text-cyan-300' : 'border-violet-500/30 bg-violet-500/10 text-violet-300')}>
            <Icon name={icon} size={20} />
          </div>
          <div className={cx('grid h-5 w-5 place-items-center rounded-full border-2 transition-colors',
            active ? (tone === 'cyan' ? 'border-cyan-400 bg-cyan-400' : 'border-violet-400 bg-violet-400') : 'border-slate-600')}>
            {active ? <Icon name="Check" size={12} className="text-slate-950" strokeWidth={3} /> : null}
          </div>
        </div>
        <div className="mt-4 flex items-center gap-2">
          <Badge tone={tone}>{value === 'single' ? 'Badge A' : 'Badge B'}</Badge>
        </div>
        <h3 className="mt-3 text-sm font-bold text-white">{title}</h3>
        <p className="mt-1.5 text-xs leading-relaxed text-slate-400">{body}</p>
      </button>
    );
  };

  return (
    <Modal open={open} onClose={onClose} size="md" labelledBy="nx-new-project-title">
      <ModalHeader icon="FolderPlus" title="Create a new project" tone="cyan" onClose={onClose}
        subtitle={step === 1 ? 'Step 1 of 2 · Choose the workspace structure' : 'Step 2 of 2 · Name it and optionally import existing code'} />

      <div className="flex items-center gap-2 border-b border-slate-800/70 bg-slate-950/40 px-6 py-3">
        {[1, 2].map((n) => (
          <React.Fragment key={n}>
            <div className={cx('flex items-center gap-2 text-[11px] font-bold uppercase tracking-widest transition-colors',
              step >= n ? 'text-cyan-300' : 'text-slate-600')}>
              <span className={cx('grid h-6 w-6 place-items-center rounded-full border text-[11px]',
                step > n ? 'border-emerald-500/50 bg-emerald-500/15 text-emerald-300'
                  : step === n ? 'border-cyan-500/60 bg-cyan-500/15 text-cyan-300'
                    : 'border-slate-700 text-slate-600')}>
                {step > n ? <Icon name="Check" size={11} strokeWidth={3} /> : n}
              </span>
              {n === 1 ? 'Structure' : 'Metadata'}
            </div>
            {n === 1 ? <div className={cx('h-px flex-1 transition-colors', step > 1 ? 'bg-emerald-500/40' : 'bg-slate-800')} /> : null}
          </React.Fragment>
        ))}
      </div>

      <div className="nx-scroll flex-1 overflow-y-auto px-6 py-6">
        {step === 1 ? (
          <div className="grid gap-4 sm:grid-cols-2 animate-fade-in">
            {structureCard('single', 'FileCode2', 'Single Unified HTML File',
              'One document holds markup, styles and behaviour. Fastest path to a shareable tunnel link.', 'cyan')}
            {structureCard('split', 'Layers', 'Split Component View',
              'HTML, CSS and JS live in separate panes and are compiled into one portable document on demand.', 'violet')}
          </div>
        ) : (
          <div className="space-y-6 animate-fade-in">
            <Field label="Project name" icon="Type" error={nameError}
              hint="Shown on the dashboard card, in the workspace header and inside the tunnel payload.">
              <input
                type="text" className={inputClass} autoFocus maxLength={64}
                placeholder="e.g. Realtime Video Lounge"
                value={name}
                onChange={(e) => { setName(e.target.value); if (nameError) setNameError(''); }}
                onKeyDown={(e) => { if (e.key === 'Enter') submit(); }}
              />
            </Field>

            <Field label="Import code from a local file (optional)" icon="Upload"
              hint={imported ? undefined : 'Drop an .html, .css, .js, .json, .svg or .txt file. For split projects the pane is chosen by extension.'}>
              <div
                onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)}
                onDrop={onDrop}
                onClick={() => fileRef.current && fileRef.current.click()}
                className={cx('flex cursor-pointer flex-col items-center justify-center rounded-2xl border-2 border-dashed px-6 py-8 text-center transition-all duration-200',
                  dragging ? 'border-cyan-400/80 bg-cyan-500/10' : 'border-slate-700/70 bg-slate-950/50 hover:border-cyan-500/50 hover:bg-slate-900/50')}>
                <input ref={fileRef} type="file" className="hidden"
                  accept=".html,.htm,.css,.js,.mjs,.cjs,.txt,.md,.svg,.json"
                  onChange={(e) => readFile(e.target.files && e.target.files[0])} />
                {imported ? (
                  <>
                    <div className="grid h-11 w-11 place-items-center rounded-xl border border-emerald-500/30 bg-emerald-500/10 text-emerald-300">
                      <Icon name="FileCheck2" size={20} />
                    </div>
                    <p className="mt-3 text-sm font-semibold text-white">{imported.name}</p>
                    <p className="mt-1 text-xs text-slate-400">
                      {bytesFmt(imported.text.length)} · {lineCount(imported.text)} lines · detected as <span className="font-mono text-cyan-300">.{imported.ext}</span>
                    </p>
                    <button type="button" className="mt-3 text-[11px] font-semibold text-rose-300 hover:text-rose-200"
                      onClick={(e) => { e.stopPropagation(); setImported(null); setImportError(''); }}>
                      Remove import
                    </button>
                  </>
                ) : (
                  <>
                    <div className="grid h-11 w-11 place-items-center rounded-xl border border-slate-700/60 bg-slate-900/70 text-slate-400">
                      <Icon name="UploadCloud" size={20} />
                    </div>
                    <p className="mt-3 text-sm font-semibold text-slate-200">Drop a file here, or click to browse</p>
                    <p className="mt-1 text-xs text-slate-500">Max 2 MB · nothing ever leaves this browser</p>
                  </>
                )}
              </div>
            </Field>

            {importError ? (
              <div className="flex items-start gap-2.5 rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-xs text-rose-200">
                <Icon name="AlertTriangle" size={14} className="mt-0.5 shrink-0" />
                <span>{importError}</span>
              </div>
            ) : null}

            <div className="rounded-xl border border-slate-800/70 bg-slate-950/50 px-4 py-3 text-xs text-slate-400">
              <div className="flex items-center gap-2 font-semibold text-slate-300">
                <Icon name="Info" size={13} /> Selected structure
              </div>
              <p className="mt-1.5">
                {type === 'single'
                  ? 'Single Unified HTML File — one pane holding the whole document.'
                  : 'Split Component View — index.html, style.css and script.js panes, compiled together for preview, download and tunnel.'}
              </p>
            </div>
          </div>
        )}
      </div>

      <div className="flex items-center justify-between gap-3 border-t border-slate-800/70 bg-slate-950/40 px-6 py-4">
        <div className="text-[11px] text-slate-500">
          {step === 1 ? 'Pick a structure to continue' : (imported ? 'Imported code will seed the project' : 'Starter template will be loaded')}
        </div>
        <div className="flex gap-2">
          {step === 2 ? <Button variant="ghost" size="sm" icon="ChevronLeft" onClick={() => setStep(1)}>Back</Button> : null}
          {step === 1
            ? <Button variant="primary" size="sm" icon="ChevronRight" onClick={() => setStep(2)}>Continue</Button>
            : <Button variant="primary" size="sm" icon="Sparkles" onClick={submit}>Create project</Button>}
        </div>
      </div>
    </Modal>
  );
}

/* ── CODE PANE ─────────────────────────────────────────────────────────── */
function CodePane({ pane, value, onChange, onClear, onRemoveTemplate, wrap, onToggleWrap, layout }) {
  const taRef = useRef(null);
  const gutterRef = useRef(null);
  const [cursor, setCursor] = useState({ line: 1, col: 1 });
  const [copied, setCopied] = useState(false);

  const lines = Math.max(1, lineCount(value));

  const syncScroll = () => {
    if (gutterRef.current && taRef.current) gutterRef.current.scrollTop = taRef.current.scrollTop;
  };

  const updateCursor = () => {
    const ta = taRef.current;
    if (!ta) return;
    const upto = ta.value.slice(0, ta.selectionStart);
    const parts = upto.split('\n');
    setCursor({ line: parts.length, col: parts[parts.length - 1].length + 1 });
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const ta = taRef.current;
      const s = ta.selectionStart, t = ta.selectionEnd;
      const next = value.slice(0, s) + '  ' + value.slice(t);
      onChange(next);
      requestAnimationFrame(() => { ta.selectionStart = ta.selectionEnd = s + 2; updateCursor(); });
      return;
    }
    if (e.key === 'Enter') {
      const ta = taRef.current;
      const s = ta.selectionStart;
      const lineStart = value.lastIndexOf('\n', s - 1) + 1;
      const indent = (value.slice(lineStart, s).match(/^[ \t]*/) || [''])[0];
      if (indent) {
        e.preventDefault();
        const next = value.slice(0, s) + '\n' + indent + value.slice(ta.selectionEnd);
        onChange(next);
        const pos = s + 1 + indent.length;
        requestAnimationFrame(() => { ta.selectionStart = ta.selectionEnd = pos; updateCursor(); });
      }
    }
  };

  const copyPane = async () => {
    const ok = await copyText(value);
    setCopied(ok);
    setTimeout(() => setCopied(false), 1400);
  };

  const tone = {
    cyan: 'text-cyan-300 border-cyan-500/30 bg-cyan-500/10',
    violet: 'text-violet-300 border-violet-500/30 bg-violet-500/10',
    amber: 'text-amber-300 border-amber-500/30 bg-amber-500/10'
  }[pane.tone] || 'text-slate-300 border-slate-700 bg-slate-800/40';

  return (
    <section className="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden rounded-xl border border-slate-800/60 bg-slate-900/70 backdrop-blur-md nx-inset">
      <header className="flex shrink-0 items-center gap-2 border-b border-slate-800/60 bg-slate-950/60 px-3 py-2">
        <span className={cx('grid h-6 w-6 shrink-0 place-items-center rounded-md border', tone)}>
          <Icon name={pane.icon} size={12} />
        </span>
        <span className="text-xs font-bold tracking-wide text-slate-200">{pane.label}</span>
        <span className="hidden font-mono text-[10.5px] text-slate-500 sm:inline">{pane.file}</span>
        <div className="ml-auto flex items-center gap-1">
          <span className="mr-1 hidden font-mono text-[10.5px] text-slate-500 md:inline">
            {lines} ln · {bytesFmt(value.length)}
          </span>
          <button onClick={onToggleWrap} title={wrap ? 'Disable soft wrap' : 'Enable soft wrap'} aria-label="Toggle soft wrap"
            className={cx('rounded-md p-1.5 transition-colors', wrap ? 'bg-cyan-500/15 text-cyan-300' : 'text-slate-500 hover:bg-slate-800 hover:text-slate-200')}>
            <Icon name="WrapText" size={13} />
          </button>
          <button onClick={copyPane} title="Copy pane contents" aria-label="Copy pane contents"
            className="rounded-md p-1.5 text-slate-500 transition-colors hover:bg-slate-800 hover:text-slate-200">
            <Icon name={copied ? 'Check' : 'Copy'} size={13} className={copied ? 'text-emerald-400' : ''} />
          </button>
          <button onClick={onRemoveTemplate} title="Remove current template — leaves a blank canvas" aria-label="Remove template"
            className="rounded-md p-1.5 text-slate-500 transition-colors hover:bg-amber-500/15 hover:text-amber-300">
            <Icon name="Eraser" size={13} />
          </button>
          <button onClick={onClear} title="Clear this pane" aria-label="Clear pane"
            className="rounded-md p-1.5 text-slate-500 transition-colors hover:bg-rose-500/15 hover:text-rose-300">
            <Icon name="Trash2" size={13} />
          </button>
        </div>
      </header>

      <div className="relative flex min-h-0 flex-1">
        <pre ref={gutterRef} aria-hidden="true"
          className="nx-scroll nx-gutter shrink-0 overflow-hidden border-r border-slate-800/60 bg-slate-950/50 py-3 text-right font-mono text-[12px] leading-[1.65] text-slate-600"
          style={{ width: '52px', margin: 0 }}>
          {Array.from({ length: lines }, (_, i) => (
            <div key={i} className="px-2">{i + 1}</div>
          ))}
        </pre>
        <textarea
          ref={taRef}
          value={value}
          spellCheck={false}
          wrap={wrap ? 'soft' : 'off'}
          onChange={(e) => { onChange(e.target.value); updateCursor(); }}
          onScroll={syncScroll}
          onKeyUp={updateCursor}
          onClick={updateCursor}
          onKeyDown={handleKeyDown}
          placeholder={pane.placeholder}
          className={cx('nx-scroll nx-editor min-h-0 flex-1 resize-none border-0 bg-transparent px-3 py-3 font-mono text-[12.5px] leading-[1.65] text-slate-200',
            wrap ? 'whitespace-pre-wrap' : 'overflow-x-auto whitespace-pre')}
        />
      </div>

      <footer className="flex shrink-0 items-center gap-3 border-t border-slate-800/60 bg-slate-950/50 px-3 py-1.5 font-mono text-[10.5px] text-slate-500">
        <span>Ln {cursor.line}, Col {cursor.col}</span>
        <span className="hidden sm:inline">{lines} lines</span>
        <span className="ml-auto">{pane.label.toLowerCase()} pane</span>
      </footer>
    </section>
  );
}

/* ── TUNNEL MODAL ──────────────────────────────────────────────────────── */
function TunnelModal({ open, onClose, tunnel, project, onRevoke, onRecreate, onOpenLink, onCopy }) {
  const [now, setNow] = useState(Date.now());
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (!open) return undefined;
    const t = setInterval(() => setNow(Date.now()), 500);
    return () => clearInterval(t);
  }, [open]);

  useEffect(() => { if (open) setCopied(false); }, [open, tunnel && tunnel.id]);

  if (!open || !tunnel) return null;

  const remaining = tunnel.exp ? tunnel.exp - now : 0;
  const live = tunnel.state === 'active' && remaining > 0;
  const pct = tunnel.exp ? Math.max(0, Math.min(100, (remaining / APP.ttl) * 100)) : 0;

  const doCopy = async () => {
    const ok = await copyText(tunnel.url || '');
    setCopied(ok);
    onCopy && onCopy(ok);
    setTimeout(() => setCopied(false), 1800);
  };

  const statusMap = {
    active: { tone: 'emerald', icon: 'RadioTower', label: 'Tunnel live' },
    expired: { tone: 'amber', icon: 'TimerOff', label: 'Tunnel expired' },
    revoked: { tone: 'rose', icon: 'ShieldOff', label: 'Tunnel revoked' },
    error: { tone: 'rose', icon: 'AlertTriangle', label: 'Tunnel failed' }
  };
  const st = statusMap[tunnel.state] || statusMap.active;

  return (
    <Modal open={open} onClose={onClose} size="lg" labelledBy="nx-tunnel-title">
      <ModalHeader icon="RadioTower" tone={live ? 'emerald' : st.tone === 'rose' ? 'rose' : 'cyan'}
        title={live ? 'Browser Tunnel is serving' : st.label}
        subtitle={project ? project.name + ' · served as a real top-level document (zero iframes)' : undefined}
        onClose={onClose} />

      <div className="nx-scroll flex-1 overflow-y-auto px-6 py-6">
        {tunnel.state === 'error' ? (
          <div className="rounded-2xl border border-rose-500/30 bg-rose-500/10 p-5">
            <div className="flex items-start gap-3">
              <Icon name="AlertTriangle" size={18} className="mt-0.5 shrink-0 text-rose-300" />
              <div>
                <h3 className="text-sm font-bold text-rose-100">The tunnel could not be packed</h3>
                <p className="mt-1.5 text-xs leading-relaxed text-rose-200/90">{tunnel.error}</p>
                <div className="mt-4 flex gap-2">
                  <Button variant="danger" size="sm" icon="RefreshCw" onClick={onRecreate}>Retry</Button>
                  <Button variant="ghost" size="sm" onClick={onClose}>Close</Button>
                </div>
              </div>
            </div>
          </div>
        ) : (
          <div className="space-y-5">
            {/* status strip */}
            <div className={cx('nx-scanline relative overflow-hidden rounded-2xl border p-5',
              live ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-slate-700/60 bg-slate-950/50')}>
              <div className="flex flex-wrap items-center gap-4">
                <div className={cx('relative grid h-14 w-14 shrink-0 place-items-center rounded-2xl border',
                  live ? 'border-emerald-500/40 bg-emerald-500/10 text-emerald-300' : 'border-slate-700 bg-slate-900 text-slate-400')}>
                  <Icon name={live ? 'RadioTower' : 'PowerOff'} size={24} />
                  {live ? <span className="absolute -right-1 -top-1 h-3.5 w-3.5 rounded-full bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,.9)]" /> : null}
                </div>
                <div className="min-w-[150px] flex-1">
                  <div className="flex items-center gap-2">
                    <Badge tone={live ? 'emerald' : tunnel.state === 'expired' ? 'amber' : 'rose'} icon={st.icon}>{st.label}</Badge>
                    <Badge tone="slate" icon="Clock">{tunnel.state === 'active' ? 'Tunnel active for: ' + fmtClock(remaining) : fmtClock(0)}</Badge>
                  </div>
                  <div className="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-slate-800">
                    <div className={cx('h-full rounded-full transition-all duration-500',
                      pct > 50 ? 'bg-gradient-to-r from-emerald-400 to-cyan-400' : pct > 20 ? 'bg-gradient-to-r from-amber-400 to-emerald-400' : 'bg-gradient-to-r from-rose-500 to-amber-400')}
                      style={{ width: pct + '%' }} />
                  </div>
                  <p className="mt-2 text-[11px] text-slate-400">
                    {live
                      ? 'Link self-destructs at ' + fmtDate(tunnel.exp) + '. The Service Worker unpacks it in memory — nothing is ever uploaded.'
                      : tunnel.state === 'revoked'
                        ? 'This link has been killed. Anyone opening it now receives a revoked notice.'
                        : 'This link has reached its expiry and no longer serves content.'}
                  </p>
                </div>
              </div>
            </div>

            {/* URL */}
            <Field label="Live deployment URL" icon="Link2"
              hint="Open it in a new tab, or share it. Anyone with the link can load the app while it is live.">
              <div className="flex flex-col gap-2 sm:flex-row">
                <input readOnly value={tunnel.url || ''} onFocus={(e) => e.target.select()}
                  className={cx(inputClass, 'font-mono text-[11.5px] text-cyan-200')} />
                <div className="flex gap-2">
                  <Button variant={copied ? 'outline' : 'primary'} size="md" icon={copied ? 'Check' : 'Copy'}
                    className="shrink-0" onClick={doCopy} disabled={!live}>
                    {copied ? 'Copied' : 'Copy Live Link'}
                  </Button>
                  <Button variant="ghost" size="md" icon="ExternalLink" className="shrink-0"
                    onClick={onOpenLink} disabled={!live}>
                    Open
                  </Button>
                </div>
              </div>
            </Field>

            {tunnel.oversized ? (
              <div className="flex items-start gap-2.5 rounded-xl border border-amber-500/30 bg-amber-500/10 px-4 py-3 text-xs text-amber-200">
                <Icon name="AlertTriangle" size={14} className="mt-0.5 shrink-0" />
                <span>
                  This payload is {tunnel.urlLength.toLocaleString()} characters — beyond the {APP.urlBudget.toLocaleString()}-character
                  comfort zone for URL transport. Some chat apps and proxies truncate very long links. For payloads this large,
                  prefer the download button and host the file directly.
                </span>
              </div>
            ) : null}

            {/* metrics */}
            <div className="grid gap-3 sm:grid-cols-4">
              {[
                { label: 'Source size', value: bytesFmt(tunnel.docBytes), icon: 'FileCode2' },
                { label: 'Packed payload', value: tunnel.payloadChars.toLocaleString() + ' ch', icon: 'Package' },
                { label: 'Compression', value: '−' + tunnel.ratio + '%', icon: 'Minimize2' },
                { label: 'URL length', value: tunnel.urlLength.toLocaleString() + ' ch', icon: 'Ruler' }
              ].map((m) => (
                <div key={m.label} className="rounded-xl border border-slate-800/70 bg-slate-950/50 p-3.5">
                  <div className="flex items-center gap-1.5 text-[10.5px] font-bold uppercase tracking-[.12em] text-slate-500">
                    <Icon name={m.icon} size={11} />{m.label}
                  </div>
                  <div className="mt-1.5 font-mono text-sm font-bold text-slate-100">{m.value}</div>
                </div>
              ))}
            </div>

            {/* how it works */}
            <div className="rounded-2xl border border-slate-800/70 bg-slate-950/50 p-5">
              <div className="flex items-center gap-2 text-xs font-bold uppercase tracking-[.14em] text-slate-400">
                <Icon name="Cpu" size={13} /> How this link works
              </div>
              <ol className="mt-3 space-y-2 text-xs leading-relaxed text-slate-400">
                {[
                  'Your three panes are compiled into one document and compressed with lz-string into the ?t= query parameter.',
                  'A background Service Worker (sw.js) intercepts the navigation to preview.html and unpacks the payload straight into memory.',
                  'The browser receives a genuine top-level document — no iframe, so RTCPeerConnection, PeerJS, getUserMedia and device permissions all behave natively.',
                  'Expiry is enforced twice: the worker checks the timestamp on every request, and the page itself re-validates before painting.'
                ].map((s, i) => (
                  <li key={i} className="flex gap-3">
                    <span className="mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded-md border border-slate-700 bg-slate-900 font-mono text-[10px] text-cyan-300">{i + 1}</span>
                    <span>{s}</span>
                  </li>
                ))}
              </ol>
            </div>
          </div>
        )}
      </div>

      <div className="flex flex-wrap items-center justify-between gap-3 border-t border-slate-800/70 bg-slate-950/40 px-6 py-4">
        <div className="flex items-center gap-2 text-[11px] text-slate-500">
          <Icon name="Lock" size={12} /> Nothing leaves your browser — the link carries the code itself.
        </div>
        <div className="flex gap-2">
          {tunnel.state !== 'error' ? (
            <Button variant="ghost" size="sm" icon="RefreshCw" onClick={onRecreate}>Re-arm tunnel</Button>
          ) : null}
          <Button variant="danger" size="sm" icon="ShieldOff" onClick={onRevoke} disabled={tunnel.state === 'revoked'}>
            Revoke / Kill Server
          </Button>
          <Button variant="ghost" size="sm" icon="X" onClick={onClose}>Close</Button>
        </div>
      </div>
    </Modal>
  );
}

/* ── WORKSPACE (THE IDE) ───────────────────────────────────────────────── */
const PANES = {
  single: [
    { key: 'html', label: 'HTML', icon: 'FileCode2', tone: 'cyan', file: 'index.html', placeholder: 'Paste or write your full HTML document here…' }
  ],
  split: [
    { key: 'html', label: 'HTML', icon: 'FileCode2', tone: 'cyan', file: 'index.html', placeholder: '<!DOCTYPE html> …' },
    { key: 'css', label: 'CSS', icon: 'Palette', tone: 'violet', file: 'style.css', placeholder: '/* Styles for the document */' },
    { key: 'js', label: 'JS', icon: 'Braces', tone: 'amber', file: 'script.js', placeholder: '// Behaviour for the document' }
  ]
};

function Workspace({ project, onBack, onUpdate, onDownload, onSpinUp, onRename, toast }) {
  const [layout, setLayout] = useState('columns');       // columns | tabs | preview-only
  const [activeTab, setActiveTab] = useState('html');
  const [wrap, setWrap] = useState(false);
  const [previewOn, setPreviewOn] = useState(true);
  const [previewKey, setPreviewKey] = useState(0);
  const [dirty, setDirty] = useState(false);
  const [savedAt, setSavedAt] = useState(project.updatedAt || Date.now());
  const [helpOpen, setHelpOpen] = useState(false);

  const panes = PANES[project.type] || PANES.single;
  const files = project.files || { html: '', css: '', js: '' };

  const previewDoc = useMemo(() => buildDocument({ ...project, files }), [project.type, files.html, files.css, files.js]);
  const debouncedDoc = useDebounced(previewDoc, 700);

  /* autosave */
  useEffect(() => {
    if (!dirty) return undefined;
    const t = setTimeout(() => {
      onUpdate({ files, updatedAt: Date.now() }, { silent: true });
      setDirty(false);
      setSavedAt(Date.now());
    }, 1200);
    return () => clearTimeout(t);
  }, [dirty, files]);

  /* shortcuts */
  useEffect(() => {
    const onKey = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod) return;
      if (e.key.toLowerCase() === 's') {
        e.preventDefault();
        onUpdate({ files, updatedAt: Date.now() });
        setDirty(false); setSavedAt(Date.now());
        toast('success', 'Project saved', 'All panes written to LocalStorage.');
      } else if (e.key === 'Enter') {
        e.preventDefault();
        onSpinUp();
      } else if (e.key.toLowerCase() === 'p') {
        e.preventDefault();
        setPreviewOn((v) => !v);
      } else if (e.key.toLowerCase() === 'b') {
        e.preventDefault();
        setLayout((v) => (v === 'columns' ? 'tabs' : v === 'tabs' ? 'preview-only' : 'columns'));
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [files, onUpdate, onSpinUp, toast]);

  const setPane = (key, value) => {
    const next = { ...files, [key]: value };
    onUpdate({ files: next }, { silent: true });
    setDirty(true);
  };

    const next = { ...files, [key]: '' };
    onUpdate({ files: next }, { silent: true });
    setDirty(true);
    toast('info', 'Pane cleared', 'The ' + key.toUpperCase() + ' pane is now empty.');

    let next;

      next = { ...files, [key]: '' };
    }
    onUpdate({ files: next }, { silent: true });
    setDirty(true);
    toast('warn', 'Template removed', 'The ' + key.toUpperCase() + ' pane was reset to a blank canvas.');
  };

  const saveNow = () => {

          <div className="ml-auto flex flex-wrap items-center gap-2">

function RenameModal({ target, onClose, onSubmit }) {
  const [value, setValue] = useState('');
  const [error, setError] = useState('');
  useEffect(() => { if (target) { setValue(target.name); setError(''); } }, [target]);

  const submit = () => {

  return (
    <Modal open={!!target} onClose={onClose} size="sm" labelledBy="nx-rename-title">

                onChange={(e) => { setValue(e.target.value); if (error) setError(''); }}
                onKeyDown={(e) => { if (e.key === 'Enter') submit(); }} />

/* ═══════════════════════════════════════════════════════════════════════════
   NEXUS IDE — APP SHELL, PERSISTENCE, BOOT SEQUENCE
   ═══════════════════════════════════════════════════════════════════════════ */

function useToasts() {
  const [toasts, setToasts] = useState([]);
  const dismiss = useCallback((id) => setToasts((list) => list.filter((t) => t.id !== id)), []);
  const toast = useCallback((tone, message, title) => {
    const id = uid('tst');
    setToasts((list) => [...list.slice(-4), { id, tone, message, title }]);
    setTimeout(() => setToasts((list) => list.filter((t) => t.id !== id)), tone === 'error' ? 8000 : 4200);
  }, []);
  return { toasts, toast, dismiss };
}

function App() {
  const { toasts, toast, dismiss } = useToasts();

  const [projects, setProjects] = useState([]);
  const [prefs, setPrefs] = useState({});
  const [tunnels, setTunnels] = useState([]);
  const [revoked, setRevoked] = useState([]);
  const [storageWarning, setStorageWarning] = useState('');
  const [view, setView] = useState('dashboard');
  const [activeId, setActiveId] = useState(null);

  const [newOpen, setNewOpen] = useState(false);
  const [renameTarget, setRenameTarget] = useState(null);
  const [confirmState, setConfirmState] = useState(null);
  const [helpOpen, setHelpOpen] = useState(false);

  const [tunnel, setTunnel] = useState(null);
  const [tunnelOpen, setTunnelOpen] = useState(false);
  const [building, setBuilding] = useState(false);

  const [swInfo, setSwInfo] = useState({
    supported: SWBridge.supported, secure: SWBridge.secure,
    state: SWBridge.supported ? 'pending' : (SWBridge.secure ? 'unsupported' : 'insecure'),
    scope: SWBridge.scopeUrl(), script: SWBridge.swUrl(), controlled: false, error: ''
  });

  const hydrated = useRef(false);

  /* ── hydrate from LocalStorage ─────────────────────────────────────── */
  useEffect(() => {
    Storage.probe();
    if (!Storage.available) {
      setStorageWarning(Storage.reason);
    } else {
      const rawProjects = Storage.read(K_PROJECTS, null);
      if (Array.isArray(rawProjects)) {
        const clean = rawProjects.filter((p) => p && typeof p === 'object' && p.id && p.files).map((p) => ({
          ...p,
          type: p.type === 'split' ? 'split' : 'single',
          createdAt: p.createdAt || Date.now(),
          updatedAt: p.updatedAt || p.createdAt || Date.now(),
          files: {
            html: typeof p.files.html === 'string' ? p.files.html : '',
            css: typeof p.files.css === 'string' ? p.files.css : '',
            js: typeof p.files.js === 'string' ? p.files.js : ''
          }
        }));
        setProjects(clean);
        if (clean.length !== rawProjects.length) {
          setStorageWarning('Some stored project records were unreadable and have been skipped. The rest loaded normally.');
        }
      }
      const rawPrefs = Storage.read(K_PREFS, null);
      if (rawPrefs && typeof rawPrefs === 'object') setPrefs(rawPrefs);
      const rawTunnels = Storage.read(K_TUNNELS, null);
      if (Array.isArray(rawTunnels)) setTunnels(rawTunnels);
      const rawRevoked = Storage.read(K_REVOKED, null);
      if (Array.isArray(rawRevoked)) setRevoked(rawRevoked);
    }
    hydrated.current = true;
  }, []);

  /* ── persist projects ──────────────────────────────────────────────── */
  useEffect(() => {
    if (!hydrated.current) return;
    const res = Storage.write(K_PROJECTS, projects);
    if (!res.ok) {
      setStorageWarning(res.message);
    } else if (storageWarning && !Storage.available === false) {
      setStorageWarning('');
    }
  }, [projects]);

  useEffect(() => { if (hydrated.current) Storage.write(K_PREFS, prefs); }, [prefs]);
  useEffect(() => { if (hydrated.current) Storage.write(K_TUNNELS, tunnels); }, [tunnels]);
  useEffect(() => {
    if (!hydrated.current) return;
    Storage.write(K_REVOKED, revoked);
    /* mirror revocations into IndexedDB so the Service Worker can enforce them */
    writeRevokedToIdb(revoked);
    SWBridge.post({ type: 'NEXUS_SYNC_REVOKED', ids: revoked });
  }, [revoked]);

  /* ── service worker boot ───────────────────────────────────────────── */
  const registerRouter = useCallback(async () => {
    setSwInfo((s) => ({ ...s, state: 'registering', error: '' }));
    const reg = await SWBridge.register();
    setSwInfo({
      supported: SWBridge.supported,
      secure: SWBridge.secure,
      state: SWBridge.state,
      scope: SWBridge.scopeUrl(),
      script: SWBridge.swUrl(),
      controlled: !!(navigator.serviceWorker && navigator.serviceWorker.controller),
      error: SWBridge.error
    });
    return reg;
  }, []);

  useEffect(() => {
    registerRouter().then((reg) => {
      if (!reg) return;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        setSwInfo((s) => ({ ...s, controlled: true, state: 'controlling' }));
      });
    }).catch(() => { /* state already captured in swInfo */ });
  }, [registerRouter]);

  const activeProject = useMemo(() => projects.find((p) => p.id === activeId) || null, [projects, activeId]);

  /* ── project operations ────────────────────────────────────────────── */
  const createProject = (name, type, seed, importedName) => {
    const p = makeProject(name, type, seed);
    setProjects((list) => [p, ...list]);
    setNewOpen(false);
    setActiveId(p.id);
    setView('workspace');
    toast('success', importedName ? 'Imported ' + importedName + ' into "' + p.name + '"' : 'Project "' + p.name + '" created',
      type === 'single' ? 'Single unified HTML document.' : 'Split HTML / CSS / JS workspace.');
  };

  const updateProject = (id, patch, opts) => {
    setProjects((list) => list.map((p) => (p.id === id ? { ...p, ...patch, updatedAt: patch.updatedAt || Date.now() } : p)));
    if (!opts || !opts.silent) { /* explicit saves are announced by the caller */ }
  };

  const renameProject = (id, name) => {
    setProjects((list) => list.map((p) => (p.id === id ? { ...p, name, updatedAt: Date.now() } : p)));
    toast('success', 'Renamed to "' + name + '"', 'The tunnel payload name updates on the next spin-up.');
  };

  const duplicateProject = (project) => {
    const copy = {
      ...project,
      id: uid('prj'),
      name: project.name + ' (copy)',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      files: { ...project.files }
    };
    setProjects((list) => {
      const i = list.findIndex((p) => p.id === project.id);
      const next = list.slice();
      next.splice(i + 1, 0, copy);
      return next;
    });
    toast('info', 'Duplicated "' + project.name + '"', 'An independent copy now sits beside the original.');
  };

  const deleteProject = (project) => {
    setConfirmState({
      icon: 'Trash2', tone: 'rose', title: 'Delete "' + project.name + '"?',
      subtitle: 'This cannot be undone.',
      body: <span>Every pane of this project is erased from LocalStorage immediately. Download it first if you may want it back.</span>,
      confirmLabel: 'Delete project',
      onConfirm: () => {
        setProjects((list) => list.filter((p) => p.id !== project.id));
        if (activeId === project.id) { setActiveId(null); setView('dashboard'); }
        setConfirmState(null);
        toast('warn', 'Project deleted', '"' + project.name + '" was removed from this browser.');
      }
    });
  };

  const resetWorkspace = () => {
    setConfirmState({
      icon: 'AlertTriangle', tone: 'rose', title: 'Reset the entire workspace?',
      subtitle: projects.length + ' project(s) will be erased.',
      body: <span>This wipes every project, every pane and all tunnel history stored in this browser. Export a backup first if you need one.</span>,
      confirmLabel: 'Erase everything',
      onConfirm: () => {
        setProjects([]); setTunnels([]); setRevoked([]);
        Storage.remove(K_PROJECTS); Storage.remove(K_TUNNELS); Storage.remove(K_REVOKED);
        setConfirmState(null); setView('dashboard'); setActiveId(null);
        toast('warn', 'Workspace reset', 'All projects were erased from this browser.');
      }
    });
  };

  const exportWorkspace = () => {
    const payload = { app: APP.name, version: APP.version, exportedAt: new Date().toISOString(), projects, tunnels: tunnels.slice(0, 30) };
    try {
      triggerDownload(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }),
        'nexus-workspace-' + new Date().toISOString().slice(0, 10) + '.json');
      toast('success', 'Backup exported', projects.length + ' project(s) written to a JSON file.');
    } catch (e) {
      toast('error', 'Export failed: ' + String((e && e.message) || e));
    }
  };

  const importWorkspace = (file) => {
    const reader = new FileReader();
    reader.onerror = () => toast('error', 'Could not read that backup file.');
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result || '{}'));
        const incoming = Array.isArray(data.projects) ? data.projects : [];
        if (!incoming.length) { toast('warn', 'Nothing to import', 'That backup contains no projects.'); return; }
        const existing = new Set(projects.map((p) => p.id));
        const merged = incoming
          .filter((p) => p && p.id && p.files)
          .map((p) => (existing.has(p.id) ? { ...p, id: uid('prj'), name: p.name + ' (imported)' } : p));
        setProjects((list) => [...merged, ...list]);
        toast('success', 'Imported ' + merged.length + ' project(s)', 'Duplicate ids were given fresh identities.');
      } catch (e) {
        toast('error', 'Invalid backup file', 'Expected a JSON export produced by this app.');
      }
    };
    reader.readAsText(file);
  };

  const handleDownload = (project) => {
    try {
      const r = downloadProject(project);
      toast('success', 'Packaged as ' + r.filename,
        r.kind === 'zip' ? 'ZIP contains index.html, style.css, script.js plus a compiled dist/index.html.'
          : r.kind === 'html-fallback' ? 'ZIP library was unavailable, so a single compiled document was delivered instead.'
            : 'Clean standalone HTML document.');
    } catch (e) {
      toast('error', 'Download failed', String((e && e.message) || e));
    }
  };

  /* ── tunnel operations ─────────────────────────────────────────────── */
  const spinUp = useCallback((project) => {
    const target = project || activeProject;
    if (!target) { toast('warn', 'No project selected', 'Open a project before spinning up a tunnel.'); return; }
    setBuilding(true);
    setTimeout(() => {
      const result = buildTunnel(target);
      if (!result.ok) {
        setTunnel({ state: 'error', error: result.error, url: '', id: uid('tun'), exp: 0, docBytes: 0, payloadChars: 0, urlLength: 0, ratio: 0 });
      } else {
        setTunnel({ ...result, state: 'active', projectId: target.id, projectName: target.name, createdAt: Date.now() });
        setTunnels((list) => [{ id: result.id, projectId: target.id, projectName: target.name, createdAt: Date.now(), exp: result.exp, urlLength: result.urlLength, docBytes: result.docBytes }, ...list].slice(0, 30));
        toast('success', 'Tunnel server live', 'Link active for 15:00 · ' + bytesFmt(result.docBytes) + ' packed to ' + result.payloadChars.toLocaleString() + ' characters.');
      }
      setBuilding(false);
      setTunnelOpen(true);
    }, 420);
  }, [activeProject, toast]);

  const revokeTunnel = () => {
    if (!tunnel) return;
    const id = tunnel.id;
    setTunnel((t) => ({ ...t, state: 'revoked' }));
    setRevoked((list) => (list.indexOf(id) === -1 ? [...list, id].slice(-200) : list));
    SWBridge.post({ type: 'NEXUS_REVOKE', id });
    toast('warn', 'Tunnel revoked', 'Anyone opening that link now receives a revoked notice.');
  };

  const openTunnelLink = () => {
    if (!tunnel || !tunnel.url) return;
    const w = window.open(tunnel.url, '_blank', 'noopener,noreferrer');
    if (!w) toast('warn', 'Popup blocked', 'Allow popups for this page, or copy the link and paste it into a new tab.');
  };

  const copyTunnelLink = (ok) => {
    if (ok) toast('success', 'Link copied', 'Paste it into any tab — the router will unpack it in memory.');
    else toast('error', 'Clipboard blocked', 'Select the URL field and copy it manually.');
  };

  /* ── global keyboard: new project ──────────────────────────────────── */
  useEffect(() => {
    const onKey = (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.shiftKey && e.key.toLowerCase() === 'n') { e.preventDefault(); setNewOpen(true); }
      if (e.key === 'Escape' && building) setBuilding(false);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [building]);

  /* ── render ────────────────────────────────────────────────────────── */
  return (
    <div className="flex h-full min-h-0 flex-col">
      {view === 'workspace' && activeProject ? (
        <Workspace
          key={activeProject.id}
          project={activeProject}
          onBack={() => { setView('dashboard'); setActiveId(null); }}
          onUpdate={(patch, opts) => updateProject(activeProject.id, patch, opts)}
          onDownload={handleDownload}
          onSpinUp={() => spinUp(activeProject)}
          onRename={() => setRenameTarget(activeProject)}
          toast={toast}
        />
      ) : (
        <Dashboard
          projects={projects}
          swState={swInfo.state}
          storageWarning={storageWarning}
          onNew={() => setNewOpen(true)}
          onOpen={(p) => { setActiveId(p.id); setView('workspace'); }}
          onRename={(p) => setRenameTarget(p)}
          onDownload={handleDownload}
          onDelete={deleteProject}
          onDuplicate={duplicateProject}
          onResetAll={resetWorkspace}
        />
      )}

      <NewProjectModal open={newOpen} onClose={() => setNewOpen(false)} onCreate={createProject} />

      <RenameModal
        target={renameTarget}
        onClose={() => setRenameTarget(null)}
        onSubmit={(name) => { if (renameTarget) renameProject(renameTarget.id, name); setRenameTarget(null); }}
      />

      <TunnelModal
        open={tunnelOpen}
        onClose={() => setTunnelOpen(false)}
        tunnel={tunnel}
        project={activeProject}
        onRevoke={revokeTunnel}
        onRecreate={() => spinUp(activeProject)}
        onOpenLink={openTunnelLink}
        onCopy={copyTunnelLink}
      />

      <HelpModal
        open={helpOpen}
        onClose={() => setHelpOpen(false)}
        project={null}
        swInfo={swInfo}
        onReRegister={() => { registerRouter(); toast('info', 'Router re-registered', 'sw.js was re-fetched with updateViaCache disabled.'); }}
        onExport={exportWorkspace}
        onImport={importWorkspace}
      />

      <ConfirmDialog state={confirmState} onCancel={() => setConfirmState(null)} onConfirm={() => {}} />

      {building ? (
        <div className="fixed inset-0 z-[90] grid place-items-center bg-slate-950/80 backdrop-blur-md animate-fade-in">
          <div className="w-[min(92vw,380px)] rounded-2xl border border-emerald-500/30 bg-slate-900/90 p-7 text-center">
            <div className="mx-auto grid h-14 w-14 place-items-center rounded-2xl border border-emerald-500/40 bg-emerald-500/10 text-emerald-300">
              <Icon name="RadioTower" size={24} className="nx-spin" />
            </div>
            <h3 className="mt-4 text-sm font-bold text-white">Compressing payload…</h3>
            <p className="mt-1.5 text-xs text-slate-400">Packing panes into a self-expiring URL and warming the router.</p>
            <div className="mt-5 h-1 overflow-hidden rounded-full bg-slate-800">
              <div className="h-full w-1/2 rounded-full bg-gradient-to-r from-emerald-400 to-cyan-400 animate-shimmer"
                style={{ backgroundSize: '200% 100%' }} />
            </div>
          </div>
        </div>
      ) : null}

      <ToastHost toasts={toasts} dismiss={dismiss} />
    </div>
  );
}

/* ── IndexedDB mirror so the Service Worker can enforce revocations ────── */
function writeRevokedToIdb(ids) {
  try {
    if (typeof indexedDB === 'undefined') return;
    const req = indexedDB.open('nexus-sw', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('revoked')) db.createObjectStore('revoked', { keyPath: 'id' });
    };
    req.onsuccess = () => {
      try {
        const db = req.result;
        const tx = db.transaction('revoked', 'readwrite');
        const store = tx.objectStore('revoked');
        (ids || []).forEach((id) => store.put({ id, at: Date.now() }));
        tx.oncomplete = () => db.close();
      } catch (e) { /* non-fatal: the worker also keeps an in-memory list */ }
    };
    req.onerror = () => { /* non-fatal */ };
  } catch (e) { /* non-fatal */ }
}

/* ── BOOT ──────────────────────────────────────────────────────────────── */
(function boot() {
  const mount = document.getElementById('root');
  const fatal = (title, detail, hint) => {
    if (!mount) return;
    mount.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'height:100%;display:grid;place-items:center;padding:24px;background:#020617;font-family:ui-sans-serif,system-ui,sans-serif';
    wrap.innerHTML =
      '<div style="max-width:620px;border:1px solid rgba(244,63,94,.35);background:rgba(15,23,42,.85);border-radius:18px;padding:28px;color:#e2e8f0">' +
      '<div style="font-size:30px">⚠️</div>' +
      '<h1 style="margin:12px 0 6px;font-size:19px">' + title + '</h1>' +
      '<p style="margin:0 0 14px;font-size:13px;line-height:1.7;color:#94a3b8">' + (hint || '') + '</p>' +
      '<pre style="margin:0;padding:14px;border-radius:12px;background:#020617;border:1px solid rgba(148,163,184,.16);font-size:11.5px;color:#fda4af;white-space:pre-wrap;overflow:auto;max-height:220px">' +
      String(detail).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])) +
      '</pre>' +
      '<button onclick="location.reload()" style="margin-top:18px;padding:10px 18px;border:0;border-radius:10px;font-weight:600;cursor:pointer;color:#04212b;background:linear-gradient(135deg,#22d3ee,#34d399)">Reload application</button>' +
      '</div>';
    mount.appendChild(wrap);
  };

  const missing = [];
  if (!window.React) missing.push('React 18');
  if (!window.ReactDOM) missing.push('ReactDOM 18');
  if (!window.Babel) missing.push('Babel Standalone');
  if (missing.length) {
    fatal('Runtime libraries failed to load',
      'Missing: ' + missing.join(', ') + '\n\nEach library is served from unpkg with a jsDelivr fallback. This normally means the network blocked both CDNs, or an extension (ad/privacy blocker, offline mode) stripped the script tags.',
      'Check your connection or content blocker, then reload. The IDE needs these three CDNs the first time it runs; your projects are already stored locally and are not affected.');
    return;
  }

  try {
    ReactDOM.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>,
      mount
    );
  } catch (e) {
    fatal('The application could not start', (e && e.stack) || String(e),
      'This is usually a syntax error introduced while editing the source. Restore the original file and reload.');
  }
})();

</script>
</body>
</html>
